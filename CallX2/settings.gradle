pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.getstream.io/artifactory/libs-release/"
            content { includeGroup "io.getstream" }
        }
        maven { url "https://jitpack.io" }
    }
}
rootProject.name = "CallX"

// ── Existing modules ──
include ':app'
include ':patternlockview'

// ── Modular Architecture ──
include ':core-lite'
include ':core'
include ':feature-chat'
include ':feature-reels'
include ':feature-calls'
include ':feature-status'
include ':feature-x'
include ':feature-youtube'
include ':feature-games'
include ':feature-payments'

// ── Performance: Macrobenchmark module ───────────────────────────────
// Real device pe measured baseline profile generate karta hai.
// Run: ./gradlew :macrobenchmark:generateBaselineProfile
include ':macrobenchmark'

// ── Admin app: separate standalone app for reviewing verification-badge
//    requests (approve/reject). Depends only on :core-lite (shares FirebaseUtils'
//    verification_requests/admins helpers + the ic_verified_pink asset) —
//    not on :app or any feature-* module, so it builds/installs completely
//    independently of the main CallX2 app. See admin/README.md for the one
//    manual setup step (registering its own Firebase app entry).
include ':admin'
