plugins {
    id 'com.android.library'
}

android {
    namespace 'com.callx.app.chat'
    compileSdk 34

    defaultConfig { minSdk 23 }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding true }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':core')
    implementation project(':feature-payments')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.paging:paging-runtime:3.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:recyclerview-integration:4.16.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Room DB
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-paging:2.6.1'

    // SwipeReplySystem
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // Chrome Custom Tabs
    implementation 'androidx.browser:browser:1.8.0'

    // Linked Devices — QR scan (pairing) + QR generation (shown on device-detail screen)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // WorkManager
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.guava:guava:31.1-android'

    // Location share
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // In-app chat camera (ChatCameraActivity) — Telegram/Instagram-style
    // tap-for-photo/hold-for-video capture screen, replacing the old
    // system-Camera-app round trip in ChatMediaController#launchCamera().
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'androidx.camera:camera-video:1.3.1'

    // PERF (advanced optimization #7): AppCompat-aware async layout inflater
    // used by MediaEditPreloadCache to pre-inflate activity_media_edit.xml
    // off the main thread right after a camera capture finishes, so
    // MediaEditActivity#onCreate() can skip its normal synchronous inflate.
    // Deliberately the *-appcompat artifact, not plain
    // androidx.asynclayoutinflater — the plain one skips AppCompat's view
    // factory, so Buttons/ImageViews etc would come back un-tinted/
    // non-Material instead of matching what setContentView() normally builds.
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater-appcompat:1.1.0'

    // ── WhatsApp-level architecture: ViewModel + LiveData ──────────────────
    // ChatListViewModel, RecyclerViewPoolViewModel extend ViewModel/AndroidViewModel
    // and observe Room LiveData from MessageRepository.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
}
